name: Refactor Structure Audit

on:
  push:
    branches: [ci/source-structure-guardrails]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guard script
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install structure-check dependencies
        run: bun install

      - name: Audit original source and draft PR heads
        shell: bash
        run: |
          set -euo pipefail
          for ref in \
            main \
            refactor/server-helpers-modules \
            refactor/image-transformer-modules \
            refactor/kitty-server-routes \
            refactor/github-tracker-modules \
            refactor/auto-blogger-modules \
            refactor/mutex-store-internals \
            refactor/token-store-modules \
            refactor/trusted-sites-store-modules; do
            echo "::group::Structure audit: ${ref}"
            git fetch --quiet origin "refs/heads/${ref}:refs/remotes/origin/${ref}"
            target="${RUNNER_TEMP}/audit-${ref//\//-}"
            git worktree add --quiet --detach "${target}" "refs/remotes/origin/${ref}"
            (
              cd "${target}"
              bun "${GITHUB_WORKSPACE}/scripts/check-source-structure.mts" --report 2>&1 |
                grep -E '\[structure:(summary|FAIL|length)\]'
            )
            git worktree remove --force "${target}"
            echo "::endgroup::"
          done
