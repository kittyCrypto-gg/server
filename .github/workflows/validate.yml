name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: |
          set -o pipefail
          bun install 2>&1 | tee install.log

      - name: Validate source
        run: |
          set -o pipefail
          bun run validate 2>&1 | tee validate.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            install.log
            validate.log
          if-no-files-found: ignore
          retention-days: 3
